model:
  name: Qwen/Qwen2-0.5B-Instruct
  family: qwen2
  tokenizer: Qwen/Qwen2-0.5B-Instruct
  context_length: 4096
  trust_remote_code: false
runtime:
  device: auto
  dtype: auto
  quantization: null
  attn_implementation: null
generation:
  temperature: 0.8
  top_p: 0.95
  top_k: null
  max_new_tokens: 180
  repetition_penalty: 1.1
  do_sample: true
  seed: 42
adapter:
  type: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  enabled: true
training:
  output_dir: checkpoints/phase4c-miyuki-0.3
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  max_seq_length: 1024
  bf16: false
  fp16: false
  gradient_checkpointing: false
  seed: 42
  resume_from_checkpoint: checkpoints/phase4c-miyuki-0.3/checkpoint-30
  push_to_hub: false
  report_to: none
  assistant_only_loss: true
version: 0.3.0-phase4c
description: 'Phase 4C controlled dataset effect: Qwen2-0.5B + miyuki-writing-0.3
  (154 ex, SHA f3f5f6...), LoRA r16 alpha32, 3 epochs, lr2e-4, batch1 accum8, max_seq1024,
  seed42, CPU, assistant_only true. Tests whether 0.2->0.3 improves behavior with
  identical recipe.'
