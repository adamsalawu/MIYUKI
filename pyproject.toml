[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miyuki-model-lab"
version = "0.1.0"
description = "Miyuki Model Lab — foundation for the Miyuki creative writing model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miyuki Project" }]
keywords = ["nlp", "creative-writing", "llm", "peft", "trl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.2",
    "transformers>=4.41",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
eval = [
    "rouge-score>=0.1",
    "nltk>=3.8",
]

[project.scripts]
miyuki = "miyuki.cli:main"

[project.urls]
Homepage = "https://github.com/miyuki/model-lab"
Repository = "https://github.com/miyuki/model-lab"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
