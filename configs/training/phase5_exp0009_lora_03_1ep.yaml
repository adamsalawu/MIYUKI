# Experiment 0009: controlled one-epoch dataset 0.3 test.
# Intentional changes from Phase 4 are dataset, one epoch, isolated output, version, and description only.
model:
  name: "Qwen/Qwen2-0.5B-Instruct"
  family: "qwen2"
  tokenizer: "Qwen/Qwen2-0.5B-Instruct"
  context_length: 4096
  trust_remote_code: false

runtime:
  device: "auto"
  dtype: "auto"
  quantization: null
  attn_implementation: null

generation:
  temperature: 0.8
  top_p: 0.95
  top_k: null
  max_new_tokens: 180
  repetition_penalty: 1.1
  do_sample: true
  seed: 42

adapter:
  type: "lora"
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  enabled: true

training:
  output_dir: "checkpoints/phase5-exp0009-miyuki-0.3-1ep"
  num_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  max_seq_length: 1024
  bf16: false
  fp16: false
  gradient_checkpointing: false
  seed: 42
  resume_from_checkpoint: null
  push_to_hub: false
  report_to: "none"
  assistant_only_loss: true

version: "0.3.0-phase5-exp0009-1ep"
description: "Experiment 0009: single clean epoch of Qwen2-0.5B + frozen miyuki-writing-0.3 (154 examples, SHA f3f5f636ea6d412d0d06d99a0a19df743105334ea9bdc7fccad19a418759f635); Phase 4 LoRA recipe unchanged, assistant-only loss, CPU. Parent/reference baseline: experiment 0006 Phase 4. Tests early 0.3 signal before observed 2-3 epoch overfit regime."
