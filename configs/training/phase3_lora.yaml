# Phase 3 — First real MIYUKI writing adapter
# Base: Qwen/Qwen2-0.5B-Instruct, dataset miyuki-writing-0.1 (38 human-authored), LoRA CAUSAL_LM, CPU
# Conservative, reproducible, low-memory; preserves Phase1 baseline control
model:
  name: "Qwen/Qwen2-0.5B-Instruct"
  family: "qwen2"
  tokenizer: "Qwen/Qwen2-0.5B-Instruct"
  context_length: 4096
  trust_remote_code: false

runtime:
  device: "auto"       # resolves to cpu on this machine (i7-1065G7, 16GB, MX330, torch CPU)
  dtype: "auto"        # cpu -> float32
  quantization: null
  attn_implementation: null

generation:
  temperature: 0.8
  top_p: 0.95
  top_k: null
  max_new_tokens: 180
  repetition_penalty: 1.1
  do_sample: true
  seed: 42

adapter:
  type: "lora"
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null  # auto -> q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj for qwen2 (verified below)
  enabled: true

training:
  output_dir: "checkpoints/phase3-miyuki-0.1"
  num_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001      # conservative for LoRA on 0.5B
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  max_seq_length: 1024
  bf16: false                # CPU -> false
  fp16: false
  gradient_checkpointing: false  # keep false for CPU determinism; true not needed for 0.5B/1024
  seed: 42
  resume_from_checkpoint: null
  push_to_hub: false
  report_to: "none"

version: "0.1.0-phase3"
description: "Phase 3 first writing SFT: Qwen2-0.5B + miyuki-writing-0.1 (38 ex, human-authored), LoRA r16 alpha32, 1 epoch, CPU, batch1 accum8, max_seq 1024, lr 1e-4, seed 42. Hypothesis: curated anti-meta/dialogue/context examples improve instruction following vs Phase1 baseline."

# Qwen2 module verification (2026-09-24, from AutoModelForCausalLM config):
# Qwen2ForCausalLM uses Qwen2Attention (q_proj,k_proj,v_proj,o_proj) + Qwen2MLP (gate_proj,up_proj,down_proj)
# PEFT defaults for qwen2 cover exactly these 7; we leave target_modules null to use that auto list and document it.
