# Example SFT training config - template for real runs
model:
  name: "Qwen/Qwen2-0.5B-Instruct"
  family: "qwen2"
  tokenizer: "Qwen/Qwen2-0.5B-Instruct"
  context_length: 2048
  trust_remote_code: false

runtime:
  device: "auto"
  dtype: "auto"
  quantization: null

generation:
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 256
  do_sample: true
  seed: 42

adapter:
  type: "lora"
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null  # auto-detected per family
  enabled: true

training:
  output_dir: "checkpoints/miyuki-0.1"
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  max_seq_length: 1024
  bf16: false
  fp16: false
  gradient_checkpointing: true
  seed: 42

version: "0.1.0"
description: "Example SFT config - copy and adjust for real datasets."
