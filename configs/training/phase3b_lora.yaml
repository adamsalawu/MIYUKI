# Phase 3B — More optimization steps, same dataset/model/tokenizer
# Changes from Phase 3 (configs/training/phase3_lora.yaml):
#   learning_rate: 0.0001 -> 0.0002 (2e-4 per PEFT/TRL example)
#   num_epochs: 1 -> 3
# Everything else fixed to isolate effect of more optimizer steps.
# Expected: 38 examples -> 34 train / 4 eval (90/10 split, seed 42), batch1 accum8
#   Phase3: 4 optimizer steps (34/8 per epoch *1)
#   Phase3B: ~12-13 optimizer steps (34*3/8 = 12.75 -> 12) — 3x more
model:
  name: "Qwen/Qwen2-0.5B-Instruct"
  family: "qwen2"
  tokenizer: "Qwen/Qwen2-0.5B-Instruct"
  context_length: 4096
  trust_remote_code: false

runtime:
  device: "auto"
  dtype: "auto"
  quantization: null
  attn_implementation: null

generation:
  temperature: 0.8
  top_p: 0.95
  top_k: null
  max_new_tokens: 180
  repetition_penalty: 1.1
  do_sample: true
  seed: 42

adapter:
  type: "lora"
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null  # auto -> [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj] for qwen2
  enabled: true

training:
  output_dir: "checkpoints/phase3b-miyuki-0.1"
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  max_seq_length: 1024
  bf16: false
  fp16: false
  gradient_checkpointing: false
  seed: 42
  resume_from_checkpoint: null
  push_to_hub: false
  report_to: "none"

version: "0.1.0-phase3b"
description: "Phase 3B: same Qwen2-0.5B, miyuki-writing-0.1 (38 ex, SHA 9e1b97461f...), LoRA r16 alpha32, 3 epochs, lr 2e-4, batch1 accum8, max_seq 1024, seed 42. Hypothesis: 3x more optimizer steps (4->~12) teaches anti-meta/dialogue/context better."

# Preserved controls paths for metadata (do not alter):
#   Phase1 eval: evaluation/runs/phase1_qwen2_0.5b/outputs.jsonl + human_eval.yaml
#   Exp 0001: experiments/0001 (smoke), 0002: experiments/0002 (phase3), dataset miyuki-writing-0.1 SHA 9e1b97461f..., phase3 adapter checkpoints/phase3-miyuki-0.1
