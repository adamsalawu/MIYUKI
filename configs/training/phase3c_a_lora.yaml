# Phase 3C-A — System-level writing contract
# Same dataset targets as miyuki-writing-0.1, but with system contract
# Changes vs Phase 3B: only instruction formulation (system)
# Model/dataset/lr/epochs/LoRA all same as Phase 3B to isolate formulation
model:
  name: "Qwen/Qwen2-0.5B-Instruct"
  family: "qwen2"
  tokenizer: "Qwen/Qwen2-0.5B-Instruct"
  context_length: 4096
  trust_remote_code: false

runtime:
  device: "auto"
  dtype: "auto"
  quantization: null
  attn_implementation: null

generation:
  temperature: 0.8
  top_p: 0.95
  top_k: null
  max_new_tokens: 180
  repetition_penalty: 1.1
  do_sample: true
  seed: 42

adapter:
  type: "lora"
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  enabled: true

training:
  output_dir: "checkpoints/phase3c-a-miyuki-0.1"
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  save_total_limit: 2
  max_seq_length: 1024
  bf16: false
  fp16: false
  gradient_checkpointing: false
  seed: 42
  resume_from_checkpoint: null
  push_to_hub: false
  report_to: "none"

version: "0.1.0-phase3c-a"
description: "Phase 3C-A: Qwen2-0.5B + miyuki-writing-0.1-phase3c A (system contract: Miyuki is direct writing assistant...). 38 ex identical targets, 3 epochs, lr 2e-4, r16, batch1 accum8, seed42. Tests system-level behavioral framing."
